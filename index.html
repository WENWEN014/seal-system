var ITEMS_HEADERS=["item_id","公司名称","家族","法人","公司类型","注册时间","资料类型","资料类别","当前位置ID","当前位置","当前位置类型","状态","持有人","出库时间","更新时间","备注"];

<script>
/* ============ 状态 ============ */
let DB={items:[],locations:[],movements:[],cabinets:[],families:[]};
let ui={tab:"dash",q:"",qType:"全部",qStatus:"全部",ops:"out",invAll:true,invSel:new Set(),invKind:"全部",traceQ:""};
let sel={out:new Set(),in:new Set(),mv:new Set()};   // 三个 Tab 各自勾选的 item_id
let selCo=new Set();                                  // 已展开的公司
let AUTH={token:localStorage.getItem("seal_token")||"",user:localStorage.getItem("seal_user")||"",
          ts:parseInt(localStorage.getItem("seal_ts")||"0",10),role:localStorage.getItem("seal_role")||""};
let OPERATOR=localStorage.getItem("seal_operator")||"";
const SEAL_TYPES=["公章","法人章","财务章","合同章","发票章"];
const STAT_IN="在库",STAT_OUT="在外部",STAT_OFF="已缴销";
const ROWS=4,COLS=3;

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function nowStr(){const d=new Date(),p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());}
function todayStr(){return nowStr().slice(0,10);}
function toast(t,ok){const h=$("msgHost");const d=document.createElement("div");
  d.textContent=t;if(ok===false)d.className="err";h.appendChild(d);setTimeout(()=>d.remove(),3200);}
function isAdmin(){
  return AUTH.role==="master";
}
function statusBadge(it){
  if(it["状态"]===STAT_OFF)return'<span class="badge b-off">已缴销</span>';
  if(it["状态"]===STAT_OUT)return'<span class="badge b-out">在 '+esc(it["持有人"]||it["当前位置"]||"外部")+' 处</span>';
  if(!it["当前位置"]||it["当前位置"]==="待分配")return'<span class="badge b-warn">待定位</span>';
  return'<span class="badge b-in">在库</span>';
}
function posTag(it){const t=it["当前位置类型"];
  return'<span class="badge '+(t==="人员"?"b-purple":"b-blue")+'">'+esc(it["当前位置"]||"—")+'</span>';}

/* ============ API ============ */
/* ============ API（直连 Supabase，RLS 负责鉴权） ============ */
async function api(path,body){
  try{
    switch(path){
      case "/api/load":       return await loadAll();
      case "/api/move":       return await opMove(body);
      case "/api/assignpos":  return await opMove(Object.assign({},body,{action:"调拨",dest_type:"位置",purpose:body.purpose||"批量分配位置",date:body.date||todayStr()}));
      case "/api/savelayout": return await opSaveLayout(body);
      case "/api/newco":      return await opNewCo(body);
      case "/api/additem":    return await opAddItem(body);
      case "/api/edititem":   return await opEditItem(body);
      case "/api/delitem":    return await opDelItem(body);
      case "/api/delco":      return await opDelCo(body);
      case "/api/addloc":     return await opAddLoc(body);
      case "/api/delloc":     return await opDelLoc(body);
      case "/api/delcab":     return await opDelCab(body);
      case "/api/renameloc":  return await opRenameLoc(body);
      case "/api/batchimp":   return await opBatchImp(body);
      case "/api/login":      return {ok:true};
      case "/api/logout":     return {ok:true};
      default: return {ok:false,msg:"未知接口："+path};
    }
  }catch(e){ return {ok:false,msg:(e&&e.message)||String(e)}; }
}
function errMsg(e){ return (e&&(e.message||e.error_description||e.hint))||"操作失败"; }
async function sbGet(table,cols){
  const {data,error}=await sb.from(table).select(cols||"*");
  if(error) throw new Error(errMsg(error));
  return data||[];
}
async function fetchAll(table){
  if(!sb) return [];
  let all=[],from=0,size=1000;
  while(true){
    const {data,error}=await sb.from(table).select("*").range(from,from+size-1);
    if(error) throw new Error(errMsg(error));
    all=all.concat(data||[]);
    if(!data||data.length<size) break;
    from+=size;
  }
  return all;
}
function nextLocId(){
  let n=1;
  (DB.locations||[]).forEach(l=>{const m=/^L(\d+)$/.exec(l["id"]||"");if(m)n=Math.max(n,parseInt(m[1],10)+1);});
  return "L"+String(n).padStart(3,"0");
}
function nextItemId(){
  let n=1;
  (DB.items||[]).forEach(i=>{const m=/^I(\d+)$/.exec(i["item_id"]||"");if(m)n=Math.max(n,parseInt(m[1],10)+1);});
  return "I"+String(n).padStart(4,"0");
}
let _evtSeq=0;
function movRow(o){
  _evtSeq++;
  var _rnd=Math.random().toString(36).slice(2,6).toUpperCase();
  return Object.assign({"事件ID":"M"+Date.now()+"_"+_evtSeq+"_"+_rnd,"时间":nowStr(),"item_id":"","公司名称":"",
    "资料类型":"","动作":"","起点ID":"","起点名称":"","起点类型":"","终点ID":"","终点名称":"",
    "终点类型":"","操作人":OPERATOR||"","事由":"","备注":""},o);
}
async function ensureLoc(name,type,operator){
  if(!name) return "";
  const {data,error}=await sb.from("locations").select("*").eq("名称",name).eq("类型",type);
  if(error) throw new Error(errMsg(error));
  if(data&&data.length) return data[0]["id"];
  const id=nextLocId();
  const row={"id":id,"名称":name,"类型":type,"柜子":"","排":"","位":"","关联家族":"","负责人":"","备注":(type==="人员"?"外部人员":"")};
  const {error:e2}=await sb.from("locations").insert(row);
  if(e2) throw new Error(errMsg(e2));
  DB.locations.push(row);
  return id;
}
async function loadAll(){
  if(!sb) return {ok:false,msg:"Supabase 未加载，请检查网络后刷新"};
  const s=await sb.auth.getSession();
  if(!s||!s.data||!s.data.session) return {ok:false,msg:"请先登录后再查看数据"};
  const items=await fetchAll("items");
  const locations=await fetchAll("locations");
  const movements=await fetchAll("movements");
  const cab_names=[...new Set(locations.filter(l=>l["类型"]==="柜子"&&l["名称"]).map(l=>l["名称"]))].sort((a,b)=>a.localeCompare(b,"zh"));
  const cabinets=cab_names.map(c=>({name:c,rows:ROWS,cols:COLS}));
  const families=[...new Set(items.filter(i=>i["家族"]).map(i=>i["家族"]))].sort((a,b)=>a.localeCompare(b,"zh"));
  return {ok:true,items,locations,movements,cabinets,families};
}
async function opMove(body){
  const item_ids=body.item_ids||[];
  const action=body.action||"";
  const rawDest=(body.dest_name||"").trim();
  const dest_type=body.dest_type||"位置";
  const operator=(body.operator||"").trim()||"二维";
  const purpose=(body.purpose||"").trim();
  const date=body.date||todayStr();
  const dest_map=body.dest_map||{};          // 入库：每枚回原位
  const refresh_info=!!body.refresh_info;     // 入库：顺带刷公司最新家族/法人
  const new_family=(body.new_family||"").trim();
  const new_legal=(body.new_legal||"").trim();
  if(!item_ids.length) return {ok:false,msg:"请选择资料"};
  if(!action) return {ok:false,msg:"请指定动作"};
  const isOff=action==="缴销";
  if(!isOff && action!=="入库" && !rawDest) return {ok:false,msg:"请指定目标位置/人员"};
  const all=await sbGet("items");
  const items=all.filter(i=>item_ids.includes(i["item_id"]));
  if(!items.length) return {ok:false,msg:"没有匹配的资料"};

  // 调拨 + 信息更新：该公司全部在库章/执照的家族/法人同步（一条原子更新）
  if(action==="调拨" && (new_family||new_legal)){
    const cos=[...new Set(items.map(i=>i["公司名称"]))];
    const before=all.filter(i=>cos.includes(i["公司名称"])&&i["状态"]===STAT_IN);
    const upd={更新时间:nowStr()};
    if(new_family)upd["家族"]=new_family;
    if(new_legal)upd["法人"]=new_legal;
    for(const c of cos){
      const {error}=await sb.from("items").update(upd).eq("公司名称",c).eq("状态",STAT_IN);
      if(error) return {ok:false,msg:errMsg(error)};
    }
    // 信息变更留痕：未勾选移动的在库资料（如执照），各记一条"信息变更"
    const selSet=new Set(item_ids);
    const movs=[];
    before.forEach(i=>{
      if(selSet.has(i["item_id"]))return; // 勾选的走调拨合并留痕
      const chg=[];
      if(new_family && i["家族"]!==new_family)chg.push("家族 "+i["家族"]+"→"+new_family);
      if(new_legal && i["法人"]!==new_legal)chg.push("法人 "+i["法人"]+"→"+new_legal);
      if(chg.length)movs.push(movRow({item_id:i["item_id"],公司名称:i["公司名称"],资料类型:i["资料类型"],
        动作:"信息变更",起点名称:"（仅信息更新）",终点名称:"（不变）",操作人:operator,事由:chg.join("；")}));
    });
    if(movs.length){const {error:me}=await sb.from("movements").insert(movs);if(me) return {ok:false,msg:errMsg(me)};}
  }

  const movements=[];
  if(action==="入库"){
    const manual=rawDest;   // 手动指定入库位置：填了则全部入到该位置（覆盖各自回原位）
    for(const i of items){
      const dip=manual||dest_map[i["item_id"]]||"";
      const des=await ensureLoc(dip,"位置",operator);
      const f=refresh_info?companyLatestInfo(i["公司名称"]):{};
      const upd={状态:STAT_IN,持有人:"",出库时间:"",当前位置ID:des,当前位置:dip||"待分配",
        当前位置类型:"位置",更新时间:nowStr()};
      if(f["家族"]!=null)upd["家族"]=f["家族"];
      if(f["法人"]!=null)upd["法人"]=f["法人"];
      const {error}=await sb.from("items").update(upd).eq("item_id",i["item_id"]);
      if(error) return {ok:false,msg:errMsg(error)};
      const src_id=i["当前位置ID"],src_name=i["当前位置"],src_type=i["当前位置类型"]||"位置";
      movements.push(movRow({item_id:i["item_id"],公司名称:i["公司名称"],资料类型:i["资料类型"],动作:"入库",
        起点ID:src_id,起点名称:src_name,起点类型:src_type,终点ID:des,终点名称:dip||"待分配",终点类型:"位置",操作人:operator,事由:purpose}));
    }
  }else{
    const common={};
    let dest_id="",dest_name=rawDest;
    if(isOff){common["状态"]=STAT_OFF;common["持有人"]="";common["出库时间"]="";dest_name="（已缴销）";}
    else{ dest_id=await ensureLoc(rawDest,dest_type,operator); common["当前位置ID"]=dest_id;common["当前位置"]=rawDest;common["当前位置类型"]=dest_type;
      if(action==="出库"){common["状态"]=STAT_OUT;common["持有人"]=rawDest;common["出库时间"]=date;}
      else {common["状态"]=STAT_IN;common["持有人"]="";common["出库时间"]="";}
    }
    common["更新时间"]=nowStr();
    if(purpose)common["备注"]=purpose;
    const {error:ue}=await sb.from("items").update(common).in("item_id",item_ids);
    if(ue) return {ok:false,msg:errMsg(ue)};
    items.forEach(i=>{
      const src_id=i["当前位置ID"],src_name=i["当前位置"],src_type=i["当前位置类型"]||"位置";
      movements.push(movRow({item_id:i["item_id"],公司名称:i["公司名称"],资料类型:i["资料类型"],动作:action,
        起点ID:src_id,起点名称:src_name,起点类型:src_type,终点ID:dest_id,终点名称:dest_name,终点类型:(isOff?"":dest_type),操作人:operator,事由:purpose}));
    });
  }
  if(movements.length){const {error:me}=await sb.from("movements").insert(movements);if(me) return {ok:false,msg:errMsg(me)};}
  return {ok:true,moved:movements.length,detail:movements.length+" 件："+action};
}
async function opSaveLayout(body){
  const baskets=body.baskets||[];
  const operator=(body.operator||"").trim()||"二维";
  if(!baskets.length) return {ok:false,msg:"无布局数据"};
  const changes=[];
  for(const b of baskets){
    const nm=(b.名称||b.name||"").trim(); if(!nm) continue;
    const loc=DB.locations.find(l=>l["名称"]===nm); if(!loc) continue;

  const kind=l["类型"];
  let n_item=0,n_mov=0;
  if(kind==="柜子"){DB.locations.forEach(x=>{if(x["柜子"]===oldN)x["柜子"]=newN;});}
  else if(kind==="位置"){DB.items.forEach(i=>{if(i["当前位置"]===oldN){i["当前位置"]=newN;i["更新时间"]=nowStr();n_item++;}});}
  else if(kind==="人员"){DB.items.forEach(i=>{if(i["持有人"]===oldN){i["持有人"]=newN;i["更新时间"]=nowStr();n_item++;}if(i["当前位置"]===oldN){i["当前位置"]=newN;}});}
  l["名称"]=newN;
  DB.movements.forEach(m=>{if(m["起点名称"]===oldN){m["起点名称"]=newN;n_mov++;}if(m["终点名称"]===oldN){m["终点名称"]=newN;n_mov++;}});
  let {error:e1}=await sb.from("locations").update({名称:newN}).eq("id",l["id"]);
  if(e1) return {ok:false,msg:errMsg(e1)};

  else if(kind==="人员"){const {error:e4}=await sb.from("items").update({持有人:newN,更新时间:nowStr()}).eq("持有人",oldN);if(e4) return {ok:false,msg:errMsg(e4)};const {error:e5}=await sb.from("items").update({当前位置:newN}).eq("当前位置",oldN);if(e5) return {ok:false,msg:errMsg(e5)};}
  const {error:m1}=await sb.from("movements").update({起点名称:newN}).eq("起点名称",oldN);
  if(m1) return {ok:false,msg:errMsg(m1)};
  const {error:m2}=await sb.from("movements").update({终点名称:newN}).eq("终点名称",oldN);
  if(m2) return {ok:false,msg:errMsg(m2)};
  const m=movRow({起点ID:l["id"],起点名称:oldN,起点类型:kind,终点ID:l["id"],终点名称:newN,终点类型:kind,操作人:operator,事由:(kind==="柜子"?"柜子":(kind==="人员"?"人员":"筐"))+"改名"+(n_item||n_mov?("；同步 "+n_item+" 件资料、"+n_mov+" 条轨迹"):"")});
  const {error:me}=await sb.from("movements").insert(m);
  if(me) return {ok:false,msg:errMsg(me)};
  return {ok:true,items:n_item,movements:n_mov};
}
async function opBatchImp(body){
  const rows=body.rows||[];
  const operator=(body.operator||"").trim()||"二维";
  if(!rows.length) return {ok:false,msg:"无数据"};
  const created=[],skipped=[],newItems=[],newMovs=[];
  for(const r of rows){
    const name=(r.name||"").trim();
    if(!name) continue;
    const family=(r.family||"").trim();
    const legal=(r.legalPerson||"").trim();
    const ctype=r.type||"大陆";
    const reg=r.regTime||"";
    const pos=(r.position||"").trim();
    const want=[];
    for(const s of SEAL_TYPES){if(["1","1.0","true","True"].includes(String(r[s])))want.push([s,"章"]);}
    if(["1","1.0","true","True"].includes(String(r.license)))want.push(["营业执照","执照"]);
    if(!want.length) continue;
    const thisPosId=pos?await ensureLoc(pos,"位置",operator):"";
    for(const [itype,kind] of want){
      if(DB.items.some(i=>i["公司名称"]===name&&i["资料类型"]===itype)){skipped.push(name+"/"+itype);continue;}
      const tgt=kind==="章"?pos:"待分配";
      const tgt_id=kind==="章"?thisPosId:"";
      const id=nextItemId();
      newItems.push({item_id:id,公司名称:name,家族:family,法人:legal,公司类型:ctype,注册时间:reg,资料类型:itype,资料类别:kind,当前位置ID:tgt_id,当前位置:tgt||"待分配",当前位置类型:"位置",状态:STAT_IN,持有人:"",出库时间:"",更新时间:nowStr(),备注:""});
      created.push(name+"/"+itype);
      newMovs.push(movRow({item_id:id,公司名称:name,资料类型:itype,动作:"入库",起点名称:"批量导入",终点ID:tgt_id,终点名称:tgt||"待分配",终点类型:"位置",操作人:operator,事由:"批量导入"}));
    }
  }
  if(newItems.length){
    const {error}=await sb.from("items").insert(newItems);
    if(error) return {ok:false,msg:errMsg(error)};
    const {error:me}=await sb.from("movements").insert(newMovs);
    if(me) return {ok:false,msg:errMsg(me)};
  }
  return {ok:true,created,skipped};
}

/* ============ 柜子图（4 排 × 3 位，管理员可拖拽）============ */
function cabSeq(cab){
  const seq=new Array(ROWS*COLS).fill(null);
  DB.locations.filter(l=>l["类型"]==="位置"&&l["柜子"]===cab).forEach(l=>{
    const r=parseInt(l["排"]||"0",10),c=parseInt(l["位"]||"0",10);
    if(r>=1&&r<=ROWS&&c>=1&&c<=COLS) seq[(r-1)*COLS+(c-1)]=l["名称"];
  });
  return seq;
}

             :'<div class="tip">当前为只读前台，柜子布局由管理员维护。</div>';

        +(admin?' ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)"':'')+'>';
      if(nm){
        const its=DB.items.filter(x=>x["当前位置"]===nm&&x["状态"]!==STAT_OFF);

          +' onclick="basketDetail(\''+esc(nm)+'\')"><div class="bn">'+esc(nm)+'</div>'

          +'<div class="cnt">'+cos.size+' 家 · '+its.length+' 件</div></div>';

let _drag=null;
function onDragStart(e,cab,idx){_drag={cab,idx,name:cabSeq(cab)[idx]};e.target.classList.add("drag");
  try{e.dataTransfer.setData("text/plain",_drag.name||"");}catch(x){}}
function onDragEnd(e){if(e.target)e.target.classList.remove("drag");
  document.querySelectorAll(".slot.over").forEach(s=>s.classList.remove("over"));}
function onDragOver(e){e.preventDefault();e.currentTarget.classList.add("over");}
function onDragLeave(e){e.currentTarget.classList.remove("over");}
function onDrop(e){
  e.preventDefault();e.currentTarget.classList.remove("over");
  if(!_drag||!isAdmin())return;
  const toCab=e.currentTarget.getAttribute("data-cab");
  const toIdx=parseInt(e.currentTarget.getAttribute("data-idx"),10);
  const fromCab=_drag.cab,fromIdx=_drag.idx,name=_drag.name;
  if(!name)return;
  const sFrom=cabSeq(fromCab);
  if(fromCab===toCab){
    if(fromIdx===toIdx)return;
    const t=sFrom.slice();
    t.splice(fromIdx,1);t.splice(toIdx,0,name);
    const dropped=t.slice(ROWS*COLS).filter(x=>x);
    if(dropped.length){toast("目标位置放不下，该排已满",false);return;}
    applyLayout([{cab:fromCab,seq:t.slice(0,ROWS*COLS)}]);
  }else{
    const sTo=cabSeq(toCab);
    const tFrom=sFrom.slice();tFrom[fromIdx]=null;
    const tTo=sTo.slice();tTo.splice(toIdx,0,name);
    const dropped=tTo.slice(ROWS*COLS).filter(x=>x);
    if(dropped.length){toast("目标柜子放不下，空间已满",false);return;}
    applyLayout([{cab:fromCab,seq:tFrom},{cab:toCab,seq:tTo.slice(0,ROWS*COLS)}]);
  }
}
function applyLayout(list){
  const payload=[];
  const seen=new Set();
  list.forEach(({cab,seq})=>{
    if(seen.has(cab))return;seen.add(cab);
    seq.forEach((nm,i)=>{if(nm)payload.push({名称:nm,柜子:cab,排:Math.floor(i/COLS)+1,位:(i%COLS)+1});});
  });
  api("/api/savelayout",{baskets:payload,operator:OPERATOR}).then(r=>{
    if(!r.ok){toast(r.msg||"保存失败",false);return;}
    toast(r.changed?"位置已保存":"位置未变化",true);reloadAll();
  });
}

// 已有公司补章：按搜索词过滤公司下拉（含新录入的公司），并刷新可补章列表
function niCoFill(q){
  const sel=$("niCo"); if(!sel)return;
  q=(q||"").trim().toLowerCase();
  const cos=[...new Set(DB.items.map(i=>i["公司名称"]))].sort((a,b)=>a.localeCompare(b,"zh"));
  const list=q?cos.filter(c=>c.toLowerCase().includes(q)):cos;
  sel.innerHTML=list.length?list.map(c=>'<option>'+esc(c)+'</option>').join(""):'<option>无匹配公司</option>';
  niExistChk();
}
// 新建公司模式下，若填写的公司已存在，自动沿用其法人/家族/类型，避免重复录入
function niPrefill(){
  const name=(($("niName")||{}).value||"").trim();
  const t=DB.items.find(i=>i["公司名称"]===name);
  if(!t)return;
  if($("niLP")&&!$("niLP").value)$("niLP").value=t["法人"]||"";
  if($("niFam")&&!$("niFam").value)$("niFam").value=t["家族"]||"";
  const ty=$("niType");if(ty&&!ty.value)ty.value=(t["公司类型"]==="国外")?"国外":"大陆";
}
function niExistChk(){
  const name=($("niCo")||{}).value||"";
  const mine=DB.items.filter(i=>i["公司名称"]===name);
  const have=new Set(mine.map(i=>i["资料类型"]));
  const es=$("niExistSeals"), pk=$("niPick");
  if(es) es.innerHTML=mine.length?('已有：'+[...have].map(h=>'<span class="tag">'+esc(h)+'</span>').join("")):'<span class="muted">该公司无任何资料</span>';
  if(!pk)return;
  // 全部章证均可勾选；已有的标注“（已有，可再加）”，允许补刻第二枚同类型章
  const opts=SEAL_TYPES.concat(["营业执照"]);
  pk.innerHTML=opts.map(t=>'<label class="chk"><input type="checkbox" class="niPick" value="'+t+'">'+t+(have.has(t)?'<span class="muted">（已有，可再加）</span>':'')+'</label>').join("");
}
async function niExec(){
  const mode=($("niMode")||{}).value||"new";
  const pos=($("niBsk")||{}).value||"";
  if(!pos){toast("请选择入库筐",false);return;}
  if(!OPERATOR)askOperator();
  if(mode==="new"){
    const name=($("niName").value||"").trim(), lp=($("niLP").value||"").trim();
    if(!name){toast("请填写公司名称",false);return;}
    if(!lp){toast("请填写法人",false);return;}
    const seals=[...document.querySelectorAll(".niSeal:checked")].map(x=>x.value);
    if(!seals.length&&!($("niLic")||{}).checked){toast("请至少勾选一项资料",false);return;}
    const r=await api("/api/newco",{name,legalPerson:lp,family:($("niFam").value||"").trim(),
      type:($("niType")||{}).value||"大陆",regTime:"",position:pos,seals,
      license:($("niLic")||{}).checked,operator:OPERATOR||"二维",note:($("niNote").value||"").trim()});
    if(!r.ok){toast(r.msg,false);return;}
    toast("已入库："+name+(r.existed?"（已有公司，仅补新增资料）":"")+"（"+r.created.join("、")+"）",true);
  }else{
    const name=($("niCo")||{}).value||"";
    const seals=[...document.querySelectorAll(".niPick:checked")].map(x=>x.value);
    if(!seals.length){toast("请勾选要补的章",false);return;}
    const note=($("niNote").value||"").trim();
    for(const s of seals){
      const r=await api("/api/additem",{name,item:s,position:pos,operator:OPERATOR||"二维",note});
      if(!r.ok){toast(s+"："+(r.msg||"失败"),false);return;}
    }
    toast("已入库 "+seals.length+" 件（"+name+"）",true);
  }
  await reloadAll();
  ui.tab="ops";render();
}
function switchOps(k){ui.ops=k;selCo.clear();render();}
function clearSel(){sel[ui.ops].clear();selCo.clear();renderOpsList();}
function opsFilterItems(){
  // 出库：在库的章/执照；入库：在外部的；调拨：在库的；缴销：未缴销的
  if(ui.ops==="out")return DB.items.filter(i=>i["状态"]===STAT_IN&&i["当前位置"]&&i["当前位置"]!=="待分配");
  if(ui.ops==="in")return DB.items.filter(i=>i["状态"]===STAT_OUT);
  if(ui.ops==="off")return DB.items.filter(i=>i["状态"]!==STAT_OFF);
  return DB.items.filter(i=>i["状态"]===STAT_IN&&i["当前位置"]&&i["当前位置"]!=="待分配");
}
function renderOpsList(){
  const pool=opsFilterItems();
  const q=(($("opsQ").value)||"").trim().toLowerCase();
  const cos=[...new Set(pool.map(i=>i["公司名称"]))].filter(n=>
    !q||n.toLowerCase().includes(q)||pool.some(i=>i["公司名称"]===n&&
      (String(i["法人"]||"").toLowerCase().includes(q)||String(i["家族"]||"").toLowerCase().includes(q))));
  const cur=sel[ui.ops];
  $("opsCount").textContent="已选 "+cur.size+" 件 / 显示 "+cos.length+" 家";
  let h='<div class="scroll"><table><tr><th style="width:36px">选公司</th><th>公司</th><th>家族</th><th>法人</th><th>可操作资料</th></tr>';
  cos.slice(0,200).forEach(n=>{
    const its=pool.filter(i=>i["公司名称"]===n&&i["状态"]!==STAT_OFF);
    if(!its.length)return;
    const allSel=its.every(i=>cur.has(i["item_id"]));
    h+='<tr><td><input type="checkbox" '+(allSel?"checked":"")+' onchange="toggleCo(\''+esc(n)+'\',this.checked)"></td>'
      +'<td><b>'+esc(n)+'</b></td><td>'+esc(its[0]["家族"])+'</td><td>'+esc(its[0]["法人"])+'</td>'
      +'<td><div class="seallist">'+its.map(i=>{
        let lbl=esc(i["资料类型"]);
        if(ui.ops==="in"){const ol=origLocOf(i["item_id"]);lbl+=' <span class="mini">'+(ol?("原位："+ol):"原位：待分配")+'</span>';}
        return '<label class="chk"><input type="checkbox" '+(cur.has(i["item_id"])?"checked":"")
          +' onchange="toggleItem(\''+i["item_id"]+'\',this.checked)">'+lbl+'</label>';
      }).join("")+'</div></td></tr>';
  });
  if(!cos.length)h+='<tr><td colspan="5" class="muted">没有符合条件的公司</td></tr>';
  $("opsList").innerHTML=h+'</table></div>';
  renderOpsBar();
}
function toggleCo(name,on){
  const pool=opsFilterItems();const cur=sel[ui.ops];
  pool.filter(i=>i["公司名称"]===name&&i["状态"]!==STAT_OFF).forEach(i=>{
    if(on)cur.add(i["item_id"]);else cur.delete(i["item_id"]);});
  renderOpsList();
}
function toggleItem(id,on){
  const cur=sel[ui.ops];
  if(on)cur.add(id);else cur.delete(id);
  renderOpsList();
}
// 取某章出库前的原在库位置：最近一次"出库"轨迹的起点
function origLocOf(item_id){
  let best=null;
  for(const m of (DB.movements||[])){
    if(m["item_id"]===item_id && m["动作"]==="出库"){
      const t=m["时间"]||"";
      if(!best||t>best.t)best={t,name:m["起点名称"]||""};
    }
  }
  return best?best.name:"";
}
// 取公司最新一条记录的家族/法人，作为公司当前信息
function companyLatestInfo(name){
  const list=DB.items.filter(i=>i["公司名称"]===name);
  if(!list.length)return {};
  list.sort((a,b)=>{
    const ta=a["更新时间"]||"",tb=b["更新时间"]||"";
    if(ta!==tb)return ta<tb?1:-1;
    return (Number(a["item_id"])||0)<(Number(b["item_id"])||0)?1:-1;
  });
  return {家族:list[0]["家族"],法人:list[0]["法人"]};
}

    h+='<div class="fg"><span class="mini muted">'+(auto?"已带出原位置，可手改":"原位不同/未登记可手填；留空=各自回原位")+'</span></div>';
  }else if(ui.ops!=="off"){

    h+='<div class="fg"><span class="t">目标筐</span><select id="obDest">'+bs.map(p=>'<option>'+esc(p)+'</option>').join("")+'</select></div>';
  }
  h+='<div class="fg"><span class="t">备注</span><input id="obWhy" style="width:200px" placeholder="选填，记录事由"></div>';
  if(ui.ops==="mv"){

    h+='<datalist id="famList">'+fams.map(f=>'<option value="'+esc(f)+'">').join("")+'</datalist>';
    h+='<div class="fg"><span class="t">新家族（选填）</span><input id="obFam" list="famList" style="width:140px" placeholder="可下拉选/可新建"></div>';
    h+='<div class="fg"><span class="t">新法人（选填）</span><input id="obLP" style="width:140px" placeholder="不填则不变"></div>';
  }
  const label=ui.ops==="out"?"出库":ui.ops==="in"?"入库":ui.ops==="mv"?"调拨":"缴销";
  h+='<button '+(n?"":"disabled")+' onclick="execOps()">执行'+label+'</button></div>';
  $("opsBar").innerHTML=h;

async function execOps(){
  const cur=sel[ui.ops],ids=[...cur];
  if(!ids.length){toast("请先勾选资料",false);return;}
  const why=($("obWhy").value||"").trim();
  if(!OPERATOR)askOperator();
  let r;
  if(ui.ops==="in"){
    const dest=($("obDest").value||"").trim();
    const dmap={}; ids.forEach(id=>{const ol=origLocOf(id);if(ol)dmap[id]=ol;});
    r=await api("/api/move",{item_ids:ids,action:"入库",dest_name:dest,dest_map:dmap,refresh_info:true,
      operator:OPERATOR||"二维",purpose:why,date:todayStr()});
  }else if(ui.ops==="mv"){
    const dest=$("obDest").value;const lp=($("obLP").value||"").trim();const fam=($("obFam").value||"").trim();
    let purpose=why;
    if(fam||lp)purpose=(why?why+"；":"")+((fam?"家族变更："+fam:"")+(fam&&lp?"；":"")+(lp?"法人变更："+lp:""));
    r=await api("/api/move",{item_ids:ids,action:"调拨",dest_name:dest,dest_type:"位置",

/* ============ 盘点导出（矩阵式：一行一家公司）============ */
const INV_SEAL=["公章","法人章","财务章","合同章","发票章"];
const INV_LIC=["营业执照"];
function invCols(){
  const k=ui.invKind||"全部";
  if(k==="章")return INV_SEAL.slice();
  if(k==="执照")return INV_LIC.slice();
  return INV_SEAL.concat(INV_LIC);
}
/* ---- 位置：柜子→排→位 排序；显示名＝柜子-筐名 ---- */
function invBaskets(){
  const ord={};DB.cabinets.forEach((c,i)=>{ord[c.name]=i;});
  const bs=DB.locations.filter(l=>l["类型"]==="位置"&&l["名称"]);
  bs.sort((a,b)=>{
    const ca=ord[a["柜子"]]===undefined?999:ord[a["柜子"]];
    const cb=ord[b["柜子"]]===undefined?999:ord[b["柜子"]];
    if(ca!==cb)return ca-cb;
    const ra=parseInt(a["排"]||99,10),rb=parseInt(b["排"]||99,10);
    if(ra!==rb)return ra-rb;
    return parseInt(a["位"]||99,10)-parseInt(b["位"]||99,10);
  });
  return bs.map(l=>({name:l["名称"],cab:l["柜子"]||"",
    label:(l["柜子"]?l["柜子"]+"-":"")+l["名称"]}));
}
function invSelected(){                        // 选中的筐（按 柜子→筐 原顺序）
  const all=invBaskets();
  if(ui.invAll)return all;
  return all.filter(b=>ui.invSel.has(b.name));
}
function invHas(n){return ui.invAll?true:ui.invSel.has(n);}
function invMaterialize(){                     // 从"全部"切到自定义：先把全部写进集合
  if(!ui.invAll)return;
  ui.invSel=new Set(invBaskets().map(b=>b.name));
  ui.invAll=false;
}
function invToggle(name,on){
  invMaterialize();
  if(on)ui.invSel.add(name);else ui.invSel.delete(name);
  invRefresh();
}
function invToggleCab(cab,on){
  invMaterialize();
  invBaskets().filter(b=>b.cab===cab).forEach(b=>{if(on)ui.invSel.add(b.name);else ui.invSel.delete(b.name);});
  invRefresh();
}
function invCheckAll(){ui.invAll=true;ui.invSel=new Set();invRefresh();}
function invCheckNone(){ui.invAll=false;ui.invSel=new Set();invRefresh();}
function invPickHtml(){
  const byCab={},cabs=[];
  invBaskets().forEach(b=>{if(!byCab[b.cab]){byCab[b.cab]=[];cabs.push(b.cab);}byCab[b.cab].push(b);});
  return cabs.map(c=>{
    const list=byCab[c],on=list.filter(b=>invHas(b.name)).length;
    const st=on===0?0:(on===list.length?2:1);   // 0未选 1半选 2全选
    return '<div style="margin:2px 0"><label class="chk"><input type="checkbox" '
      +(st?"checked":"")+(st===1?' data-half="1"':'')

      +'<div class="seallist">'+list.map(b=>'<label class="chk"><input type="checkbox" '
      +(invHas(b.name)?"checked":"")+' onclick="invToggle(\''+esc(b.name)
      +'\',this.checked)">'+esc(b.label)+'</label>').join("")+'</div></div>';
  }).join("");
}
function invRefresh(){

    p.querySelectorAll('input[data-half="1"]').forEach(x=>{x.indeterminate=true;});}

function invSumHtml(){

  if(!n)return '<b style="color:#b42318">未选任何筐 —— 请勾选要盘点的柜子或筐</b>';
  const tail=n>4?" 等 "+n+" 个筐":(n>1?" 共 "+n+" 个筐":"");
  return "<b>已选 "+n+" 个筐</b>　<span class=\"mini\">"+esc(s.slice(0,4).map(b=>b.label).join("、"))+esc(tail)+"</span>";
}
function invInScope(i){                        // 是否算"在本次盘点范围内"
  if(i["状态"]===STAT_OFF)return false;
  const p=i["当前位置"];
  if(!p||p==="待分配")return false;
  return ui.invAll?true:ui.invSel.has(p);
}
function invWhere(i){                         // 不在盘点范围的章 → 写实际位置
  if(i["状态"]===STAT_OFF)return "已缴销";
  if(i["状态"]===STAT_OUT)return (i["持有人"]||i["当前位置"]||"外部")+"处";
  const p=i["当前位置"]||"";
  if(!p||p==="待分配")return "";              // 还没上架的（如执照）不写进第二行，避免每家都多一行
  return p;
}
function invTitle(){                          // 表格/文件名用
  const all=invBaskets(),s=invSelected();
  if(!s.length)return "未选位置";
  if(ui.invAll||s.length>=all.length)return "全部位置";
  const cabs=[...new Set(s.map(b=>b.cab).filter(Boolean))];
  if(cabs.length===1&&s.length===all.filter(b=>b.cab===cabs[0]).length)return cabs[0];  // 整柜
  if(s.length<=3)return s.map(b=>b.label).join("+");                                    // 少量筐 → 柜名-筐名
  if(cabs.length===1)return cabs[0]+"（部分）";                                          // 单柜选了一部分
  if(cabs.length<=3)return cabs.join("+");                                              // 多筐 → 柜名拼接
  return "部分位置";
}
function invMatrix(){
  const cols=invCols(),kind=ui.invKind||"全部";
  const pool=DB.items.filter(i=>kind==="全部"||i["资料类别"]===kind);
  const inItems=pool.filter(invInScope);
  const dict={};                              // 筐名 → Set(公司)
  inItems.forEach(i=>{(dict[i["当前位置"]]=dict[i["当前位置"]]||new Set()).add(i["公司名称"]);});
  const rows=[];
  invSelected().forEach(b=>{
    [...(dict[b.name]||[])].sort((x,y)=>String(x).localeCompare(String(y),"zh"))
      .forEach(co=>rows.push({co:co,basket:b}));
  });
  rows.forEach((r,idx)=>{
    const mine=pool.filter(i=>i["公司名称"]===r.co);
    const line1=cols.map(t=>{
      const n=inItems.filter(i=>i["公司名称"]===r.co&&i["资料类型"]===t&&i["当前位置"]===r.basket.name).length;
      return n>1?"✓×"+n:(n?"✓":"无");
    });
    const line2=cols.map(t=>{
      const arr=mine.filter(i=>i["资料类型"]===t&&!invInScope(i));
      if(!arr.length)return "";
      const m={};
      arr.forEach(i=>{const k=invWhere(i);if(k)m[k]=(m[k]||0)+1;});
      return Object.keys(m).map(k=>m[k]>1?k+"×"+m[k]:k).join("、");
    });
    r.no=idx+1;
    r.cab=r.basket.cab||"—";
    r.bk=r.basket.label;
    r.show=esc(r.co);
    const ci=companyLatestInfo(r.co)||{};
    r.fam=ci["家族"]||"";
    r.leg=ci["法人"]||"";
    r.lines=line2.some(x=>x)?[line1,line2]:[line1];
  });
  return {cols,groups:rows};
}
function invRows(){                            // 旧的"一行一枚章"明细（导出明细 CSV 用）
  const ord={};invBaskets().forEach((b,i)=>{ord[b.name]=i;});
  let l=DB.items.filter(i=>i["状态"]!==STAT_OFF&&invInScope(i));
  if(ui.invKind!=="全部")l=l.filter(i=>i["资料类别"]===ui.invKind);
  l.sort((a,b)=>{
    const pa=ord[a["当前位置"]]===undefined?999:ord[a["当前位置"]];
    const pb=ord[b["当前位置"]]===undefined?999:ord[b["当前位置"]];
    return pa-pb||String(a["公司名称"]).localeCompare(String(b["公司名称"]),"zh");
  });
  return l;
}

function csvEsc(v){const s=String(v==null?"":v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function invExportGuard(groups,sels){
  if(!sels){toast("请先勾选要盘点的柜子或筐",false);return false;}
  if(!groups.length){toast("该范围暂无资料",false);return false;}

}
async function exportInvXlsx(){
  if(!window.XLSX){toast("Excel 组件未加载，请检查网络后刷新",false);return;}
  const {cols,groups}=invMatrix();
  if(!invExportGuard(groups,invSelected().length))return;
  const title=invTitle()+"-盘点表-"+todayStr();
  try{
    const header=["序号","柜子","筐","公司","家族","法人"].concat(cols).concat(["实际核对"]);
    const aoa=[];
    aoa.push(header.map((_,j)=> j===0?title:""));
    aoa.push(header.slice());
    const merges=[];
    let r=2;
    for(const g of groups){
      const lines=g.lines||[]; if(!lines.length) continue;
      const span=lines.length, first=r;
      aoa[first]=aoa[first]||[];
      aoa[first][0]=g.no;
      aoa[first][1]=(g.lead&&g.lead[0])||g.cab||"";
      aoa[first][2]=(g.lead&&g.lead[1])||g.bk||"";
      aoa[first][3]=g.co;
      aoa[first][4]=g.fam||"";
      aoa[first][5]=g.leg||"";
      for(let k=0;k<span;k++){
        aoa[first+k]=aoa[first+k]||[];
        for(let c=0;c<header.length;c++){ if(aoa[first+k][c]===undefined) aoa[first+k][c]=""; }
        const line=lines[k]||[];
        for(let j=0;j<line.length;j++){ aoa[first+k][6+j]=line[j]; }
      }
      if(span>1){
        merges.push({s:{r:first,c:0},e:{r:first+span-1,c:0}});
        for(let c=1;c<=5;c++) merges.push({s:{r:first,c},e:{r:first+span-1,c}});
      }
      r+=span;
    }
    const thinAll={top:{style:"thin",color:"9AA0A6"},bottom:{style:"thin",color:"9AA0A6"},left:{style:"thin",color:"9AA0A6"},right:{style:"thin",color:"9AA0A6"}};
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    const enc=XLSX.utils.encode_cell;
    for(let j=0;j<header.length;j++){ const a=ws[enc({r:0,c:j})]; if(a){a.s={font:{bold:true,size:14},alignment:{horizontal:"center",vertical:"center",wrapText:true}};} }
    for(let j=0;j<header.length;j++){ const a=ws[enc({r:1,c:j})]; if(a){a.s={font:{bold:true,size:11},alignment:{horizontal:"center",vertical:"center",wrapText:true},fill:{fgColor:"EFF3F8"},border:thinAll};} }
    for(let i=2;i<aoa.length;i++){
      for(let j=0;j<header.length;j++){
        const a=ws[enc({r:i,c:j})]; if(!a) continue;
        const v=a.v;
        const st={alignment:{horizontal:"center",vertical:"center",wrapText:true},border:thinAll};
        if(j>=6&&j<header.length-1){
          if(v==="无"||v==="已缴销") st.font={color:"9AA0A6"};
          else if(v&&v!=="✓"&&!String(v).startsWith("✓×")) st.font={color:"BF8700"};
        }
        a.s=st;
      }
    }
    ws["!merges"]=merges;
    ws["!cols"]=header.map(h=>{const w=({"序号":6,"柜子":9,"筐":17,"公司":30,"家族":12,"法人":12,"实际核对":16})[h];return {wch:w||13};});
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"盘点表");
    const out=XLSX.write(wb,{bookType:"xlsx",type:"array"});
    const blob=new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=title+".xlsx";a.click();
    toast("已导出 "+title+".xlsx",true);
  }catch(e){toast("导出失败："+e,false);}
}
function exportInvCSV(){

  if(!l.length){toast("该范围暂无资料",false);return;}

function printInv(){
  const {cols,groups}=invMatrix();
  if(!invExportGuard(groups,invSelected().length))return;
  const nrow=groups.reduce((s,g)=>s+g.lines.length,0);
  let h='<h2 style="font-size:16px">'+esc(invTitle())+' 盘点表（'+invSelected().length+' 个筐 / '
    +groups.length+' 家公司 / '+nrow+' 行）　'+nowStr()+'</h2>'
    +'<table><tr><th>序号</th><th>柜子</th><th>筐</th><th>公司</th><th>家族</th><th>法人</th>'+cols.map(c=>'<th>'+esc(c)+'</th>').join("")+'<th>实际核对</th></tr>';
  groups.forEach(g=>{
    const rs=g.lines.length>1?' rowspan="'+g.lines.length+'"':"";
    g.lines.forEach((line,li)=>{
      h+='<tr>';
      if(li===0)h+='<td'+rs+'>'+g.no+'</td><td'+rs+'>'+esc(g.cab)+'</td><td'+rs+'>'+esc(g.bk)+'</td><td'+rs+'>'+g.show+'</td>'
        +'<td'+rs+'>'+esc(g.fam)+'</td><td'+rs+'>'+esc(g.leg)+'</td>';
      line.forEach(v=>h+='<td>'+esc(v)+'</td>');
      h+='<td></td></tr>';
    });
  });
  $("printArea").innerHTML=h+'</table>';window.print();
}

/* ============ 数据管理 ============ */
function renderData(m){
  let h='<div class="card"><h2 class="sec">数据文件</h2><div class="toolbar">'
    +'<button class="ghost" onclick="dl(\'items\')">下载 items.csv</button>'
    +'<button class="ghost" onclick="dl(\'locations\')">下载 locations.csv</button>'
    +'<button class="ghost" onclick="dl(\'movements\')">下载 movements.csv</button></div></div>';
  h+='<div class="card"><h2 class="sec">操作人</h2><div class="frow">'
    +'<div class="fg"><span class="t">当前操作人（记录在留痕中）</span><input id="opName" value="'+esc(OPERATOR)+'"></div>'
    +'<button onclick="saveOp()">保存</button></div></div>';
  h+='<div class="card"><h2 class="sec">新增公司（新注册入库）</h2>'
    +'<div class="frow"><div class="fg"><span class="t">公司名称 *</span><input id="ncName" style="width:260px"></div>'
    +'<div class="fg"><span class="t">法人 *</span><input id="ncLP"></div>'
    +'<div class="fg"><span class="t">家族</span><input id="ncFam"></div>'
    +'<div class="fg"><span class="t">类型</span><select id="ncType"><option>大陆</option><option>国外</option></select></div>'
    +'<div class="fg"><span class="t">注册时间</span><input type="date" id="ncReg"></div></div>'
    +'<div class="frow"><div class="fg"><span class="t">存放筐</span><select id="ncBsk">'
    +DB.locations.filter(l=>l["类型"]==="位置").map(l=>'<option>'+esc(l["名称"])+'</option>').join("")+'</select></div>'
    +'<span class="t" style="width:100%">章（勾选已刻的）：</span>'
    +SEAL_TYPES.map(s=>'<label class="chk"><input type="checkbox" class="ncSeal" value="'+s+'">'+s+'</label>').join("")
    +'<label class="chk"><input type="checkbox" id="ncLic" checked>营业执照</label></div>'
    +'<div style="margin-top:8px"><button onclick="doNewCo()">保存新公司</button></div></div>';
  h+='<div class="card"><h2 class="sec">批量导入新公司</h2>'
    +'<div class="tip">从 Excel 复制粘贴，列顺序：<b>类型 · 注册时间 · 家族 · 公司名称 · 法人 · 公章 · 法人章 · 财务章 · 合同章 · 发票章 · 筐号</b>（章列填 1/0）</div>'
    +'<textarea id="impText" style="width:100%;height:140px" placeholder="粘贴 Excel 数据…"></textarea>'
    +'<div style="margin-top:8px"><button onclick="doImport()">解析并导入</button></div></div>';
  m.innerHTML=h;
}
function saveOp(){OPERATOR=($("opName").value||"").trim();localStorage.setItem("seal_operator",OPERATOR);syncHeader();toast("已保存",true);}
function dl(n){
  let rows,headers,fname;
  if(n==="items"){headers=ITEMS_HEADERS;rows=DB.items;fname="items.csv";}
  else if(n==="locations"){headers=LOCS_HEADERS;rows=DB.locations;fname="locations.csv";}
  else {headers=MOVS_HEADERS;rows=DB.movements;fname="movements.csv";}
  if(!rows||!rows.length){toast("暂无数据",false);return;}
  const out=[headers.join(",")].concat(rows.map(r=>headers.map(h=>csvEsc(r[h])).join(",")));
  const csv="\ufeff"+out.join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download=fname;a.click();
  toast("已导出 "+fname,true);
}
async function doNewCo(){
  const name=($("ncName").value||"").trim(),lp=($("ncLP").value||"").trim();
  if(!name){toast("请填写公司名称",false);return;}
  if(!lp){toast("请填写法人",false);return;}
  const seals=[...document.querySelectorAll(".ncSeal:checked")].map(x=>x.value);
  const r=await api("/api/newco",{name,legalPerson:lp,family:($("ncFam").value||"").trim(),
    type:$("ncType").value,regTime:$("ncReg").value||"",position:$("ncBsk").value,
    seals,license:$("ncLic").checked,operator:OPERATOR||"二维"});
  if(!r.ok){toast(r.msg,false);return;}
  toast("已新增公司 "+name,true);await reloadAll();
}
async function doImport(){
  const txt=($("impText").value||"").trim();
  if(!txt){toast("请粘贴数据",false);return;}
  const lines=txt.split(/[\r\n]+/).map(l=>l.trim()).filter(Boolean);
  let st=0;if(/类型|公司名称/.test(lines[0]||""))st=1;
  const rows=[];
  for(let i=st;i<lines.length;i++){
    const c=lines[i].split(/\t|,/).map(s=>s.trim());
    if(c.length<5)continue;
    rows.push({type:c[0]||"大陆",regTime:c[1]||"",family:c[2]||"",name:c[3]||"",legalPerson:c[4]||"",
      公章:c[5]||"0",法人章:c[6]||"0",财务章:c[7]||"0",合同章:c[8]||"0",发票章:c[9]||"0",position:c[10]||""});
  }
  if(!rows.length){toast("无有效数据",false);return;}
  const r=await api("/api/batchimp",{rows,operator:OPERATOR||"二维"});
  if(!r.ok){toast(r.msg,false);return;}
  toast("已导入 "+r.created.length+" 件"+(r.skipped.length?"，跳过 "+r.skipped.length+" 件（已存在）":""),true);
  $("impText").value="";await reloadAll();
}

/* ============ 弹窗 ============ */
function openModal(h){$("modalBox").innerHTML=h;$("modalMask").classList.add("show");}
function closeModal(){$("modalMask").classList.remove("show");}

/* ============ boot ============ */
window.addEventListener("DOMContentLoaded",async()=>{
  if(!sb){
    $("status").textContent="Supabase 加载失败";
    $("main").innerHTML='<div class="card"><p style="color:#d1242f">前端依赖（Supabase / Excel）加载失败，请检查网络后刷新页面。</p></div>';
    return;
  }
  const s=await sb.auth.getSession();
  if(s&&s.data&&s.data.session){
    const u=s.data.session.user||{};
    const role=(u.app_metadata&&u.app_metadata.role)||"staff";
    AUTH.role=role;AUTH.user=(u.email||"").split("@")[0].toUpperCase();
    AUTH.token=s.data.session.access_token;AUTH.ts=Date.now();
    if(!OPERATOR){OPERATOR=AUTH.user;localStorage.setItem("seal_operator",OPERATOR);}
  }
  await reloadAll();
});
</script>
